# MX2 Gateway Daemon Configuration File
# Standard Unix INI Format

[daemon]
port = 8000
host = 0.0.0.0
smtp_proxy_port = 10025
imap_proxy_port = 10143
log_file = logs/mx2.log

[antispam]
quota_limit = 100
reputable_domains = github.com,google.com,utrecht-uni.nl,trusted.nl,trusted.com
database_path = storage/spam_db.json

[production]
environment = production
storage_backend = sqlite
db_path = storage/mx2_daemon.db
dnssec_strict = false
max_payload_mb = 25
pow_difficulty_default = 10
cors_allowed_origins = *

[resolvers]
did_ttl_seconds = 300
enable_dns_txt = true
enable_dns_srv = true

[tls]
enabled = false
cert_dir = config/certs
cert_file = config/certs/daemon.crt
key_file = config/certs/daemon.key

[telemetry]
prometheus_enabled = true
metrics_path = /metrics


